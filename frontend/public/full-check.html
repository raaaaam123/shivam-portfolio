<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>OVF</title>
<style>body{margin:0;font-family:monospace}#summary{padding:8px;white-space:pre-wrap;font-size:12px}iframe{display:block;border:0}</style>
</head>
<body>
<pre id="summary"></pre>
<iframe id="f" title="probe" src="/" style="width:320px;height:720px"></iframe>
<script>
  var W = parseInt(new URLSearchParams(location.search).get('w'), 10) || 320;
  var H = parseInt(new URLSearchParams(location.search).get('h'), 10) || 1100;
  document.getElementById('f').style.width = W + 'px';
  document.getElementById('f').style.height = H + 'px';
  var out = [];
  var errs = [];
  window.onerror = function (m) { errs.push(m); };
  function refresh() {
    if (errs.length) out.push('JSERRS=' + errs.join('; '));
    document.getElementById('summary').textContent = out.join('\n');
    document.title = 'DONE';
  }
  var sectIds = ['home','about','skills','experience','education','projects','contact'];

  function clippedByAncestor(el, doc) {
    var n = el.parentElement;
    while (n && n !== doc.body) {
      var o = getComputedStyle(n).overflowX;
      if (o === 'hidden' || o === 'clip') return true;
      n = n.parentElement;
    }
    return false;
  }

  setTimeout(function () {
    var win = document.getElementById('f').contentWindow;
    var doc = win.document;
    var vw = Math.max(win.innerWidth, W);

    var offenders = 0, hits = [], outside = 0, ohits = [];
    var els = doc.querySelectorAll('main *');
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (el.offsetWidth === 0 && el.offsetHeight === 0) continue;
      var er = el.getBoundingClientRect();
      if (er.right > vw + 1 || er.left < -1) {
        outside++;
        if (ohits.length < 6) ohits.push((el.tagName || '') + ':' + String(el.className || '').slice(0, 45) + ':l' + Math.round(er.left) + ':r' + Math.round(er.right));
      }
      if (el.scrollWidth > el.clientWidth + 1) {
        if (!clippedByAncestor(el, doc)) {
          offenders++;
          if (hits.length < 3) hits.push((el.tagName || '') + ':' + String(el.className || '').slice(0, 40));
        }
      }
    }
    out.push('outsideViewport=' + outside + (ohits.length ? ' OHITS=' + ohits.join('|') : '') + ' vw=' + vw + ' hscroll=' + (doc.documentElement.scrollWidth - vw) + ' unclippedScrollOvfl=' + offenders + (hits.length ? ' [' + hits.join('|') + ']' : ''));

    var sections = 0;
    var sec = [];
    for (var s = 0; s < sectIds.length; s++) {
      var e = doc.getElementById(sectIds[s]);
      if (e) { sections++; sec.push(sectIds[s]); }
    }
    out.push('sections=' + sections + ' (' + sec.join(',') + ')');

    var filled = doc.querySelectorAll('#experience [class*="scale-y-"]');
    var eduFills = doc.querySelectorAll('#education [class*="scale-y-"]');
    out.push('expFills=' + filled.length + ' eduFills=' + eduFills.length);
    var timeDelay = doc.querySelectorAll('#education [class*="transition-all"][style*="transition-d"]');
    out.push('eduStaggerWrappers=' + timeDelay.length);
    var certBlur = doc.querySelectorAll('main [class*="blur-"]');
    var certAnim = doc.querySelectorAll('#certifications');
    out.push('blurElsInMain=' + certBlur.length);

    var rooted = doc.querySelectorAll('main *').length;
    out.push('mainElements=' + rooted + (rooted > 30 ? ' ok' : ' ROOTEMPTY'));

    var mBtn = doc.querySelector('button[aria-controls="mobile-menu"]');
    if (mBtn && W < 768) {
      mBtn.click();
      setTimeout(function () {
        var menu1 = doc.getElementById('mobile-menu');
        var open1 = menu1 && menu1.getAttribute('aria-hidden') === 'false';
        var panel = menu1 ? menu1.querySelector('[class*="slide-down"]') : null;
        var fits = panel ? panel.scrollHeight <= win.innerHeight : true;
        mBtn.click();
        setTimeout(function () {
          var menuClosing = doc.getElementById('mobile-menu');
          var stillMounted = !!menuClosing;
          setTimeout(function () {
            var menuGone = !doc.getElementById('mobile-menu');
            mBtn.click();
            setTimeout(function () {
              var reopened = doc.getElementById('mobile-menu') && doc.getElementById('mobile-menu').getAttribute('aria-hidden') === 'false';
              out.push('menu open=' + open1 + ' fits=' + fits + ' closingStillMounted=' + stillMounted + ' goneAfterClose=' + menuGone + ' reopened=' + reopened);
              refresh();
            }, 350);
          }, 500);
        }, 80);
      }, 450);
    } else {
      out.push('menu=NA desktop');
      refresh();
    }
  }, 5500);
</script>
</body>
</html>
